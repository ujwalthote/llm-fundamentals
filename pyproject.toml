[project]
name = "llm-fundamentals"
version = "0.1.0"
description = "Small, measured experiments on each stage of an LLM pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "google-genai>=1.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "scipy>=1.13",
    "sentence-transformers>=5.1",
    "torch>=2.4",
    "transformers>=4.56",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
